name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Real npm publish is gated on repository variable NPM_PUBLISH=true (off unless
# the owner sets it). Dry-run publish and the npm-publish artifact always run on
# tags. id-token is required for npm provenance; once the scoped packages exist,
# npm trusted publishing (OIDC) can replace secrets.NPM_TOKEN.
permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: ccline-linux-x64.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: ccline-linux-x64-static.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            name: ccline-linux-arm64.tar.gz
            use_zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: ccline-linux-arm64-static.tar.gz
            use_zigbuild: true
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: ccline-windows-x64.zip
          - target: x86_64-apple-darwin
            os: macos-latest
            name: ccline-macos-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: ccline-macos-arm64.tar.gz

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check tag matches Cargo.toml version and CHANGELOG
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
        if [ "$tag" != "$crate" ]; then
          # The binary reports this version and the updater compares it
          # with npm, so a mismatch would publish a permanently "outdated" build
          echo "::error::tag v$tag does not match Cargo.toml version $crate"
          exit 1
        fi
        # The release notes are this section; fail before anything is built
        if ! grep -q -F "## [$tag]" CHANGELOG.md; then
          echo "::error::CHANGELOG.md has no '## [$tag]' section for the release notes"
          exit 1
        fi

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross-compilation tools
      if: matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - name: Setup Zig
      if: matrix.use_zigbuild
      uses: mlugg/setup-zig@v2
      with:
        version: 0.13.0

    - name: Install cargo-zigbuild
      if: matrix.use_zigbuild
      run: cargo install cargo-zigbuild

    - name: Install musl tools
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Build binary
      if: ${{ !matrix.use_zigbuild }}
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build binary with zigbuild
      if: matrix.use_zigbuild
      run: cargo zigbuild --release --target ${{ matrix.target }}

    - name: Package Linux/macOS
      if: matrix.os != 'windows-latest' && matrix.target != 'x86_64-pc-windows-gnu'
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/ccometixline dist/ccline
        cd dist
        tar czf ../${{ matrix.name }} ccline

    - name: Package Windows
      if: matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/ccometixline.exe dist/ccline.exe
        cd dist
        zip ../${{ matrix.name }} ccline.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: ${{ matrix.name }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    # Notes are this version's CHANGELOG.md section. git-cliff --latest would
    # span the whole upstream history, because the fork carries none of
    # upstream's tags (and pushing v1.1.2 here would trigger a release).
    - name: Generate Release Notes
      run: |
        version="${GITHUB_REF#refs/tags/v}"
        awk -v head="## [$version]" '
          index($0, head) == 1 { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > RELEASE_NOTES.md
        test -s RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*/*
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false

  npm:
    name: Prepare and publish npm packages
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Extract binaries from archives
      run: |
        mkdir -p extracted

        # macOS x64
        tar -xzf artifacts/ccline-macos-x64.tar.gz/ccline-macos-x64.tar.gz -C extracted
        mv extracted/ccline extracted/ccline-darwin-x64

        # macOS ARM64
        tar -xzf artifacts/ccline-macos-arm64.tar.gz/ccline-macos-arm64.tar.gz -C extracted
        mv extracted/ccline extracted/ccline-darwin-arm64

        # Linux x64
        tar -xzf artifacts/ccline-linux-x64.tar.gz/ccline-linux-x64.tar.gz -C extracted
        mv extracted/ccline extracted/ccline-linux-x64

        # Linux musl (static)
        tar -xzf artifacts/ccline-linux-x64-static.tar.gz/ccline-linux-x64-static.tar.gz -C extracted
        mv extracted/ccline extracted/ccline-linux-x64-musl

        # Linux ARM64
        tar -xzf artifacts/ccline-linux-arm64.tar.gz/ccline-linux-arm64.tar.gz -C extracted
        mv extracted/ccline extracted/ccline-linux-arm64

        # Linux ARM64 musl (static)
        tar -xzf artifacts/ccline-linux-arm64-static.tar.gz/ccline-linux-arm64-static.tar.gz -C extracted
        mv extracted/ccline extracted/ccline-linux-arm64-musl

        # Windows
        unzip artifacts/ccline-windows-x64.zip/ccline-windows-x64.zip -d extracted
        mv extracted/ccline.exe extracted/ccline-win32-x64.exe

        # List extracted files
        ls -la extracted/

    - name: Setup Node.js for NPM
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Prepare NPM packages
      run: |
        MAIN_NAME=$(node -p "require('./npm/main/package.json').name")
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "Preparing ${MAIN_NAME}@${VERSION}"
        node npm/scripts/prepare-packages.js "$VERSION" --bin-dir extracted

    - name: Dry-run npm publish
      run: |
        set -euo pipefail
        MAIN_NAME=$(node -p "require('./npm/main/package.json').name")
        # npm silently rewrites manifests it considers invalid at publish time
        # (npm 11 drops "./"-prefixed bin paths, which would ship a launcher
        # package without the `ccline` command): treat any rewrite as an error.
        dry_run() {
          local out
          out=$(cd "$1" && npm publish --dry-run --access public 2>&1) || { echo "$out"; return 1; }
          echo "$out"
          if grep -q "auto-corrected" <<<"$out"; then
            echo "::error::npm rewrote $1/package.json at publish time (see above)"
            return 1
          fi
        }
        PLATFORMS=(darwin-x64 darwin-arm64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64)
        for platform in "${PLATFORMS[@]}"; do
          echo "Dry-run ${MAIN_NAME}-${platform}"
          dry_run "npm-publish/${platform}"
        done
        echo "Dry-run ${MAIN_NAME}"
        dry_run npm-publish/main

    - name: Upload npm-publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: npm-publish
        path: npm-publish/
        overwrite: true

    - name: Publish platform packages to NPM
      if: ${{ vars.NPM_PUBLISH == 'true' }}
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        set -euo pipefail
        MAIN_NAME=$(node -p "require('./npm/main/package.json').name")
        VERSION=$(node -p "require('./npm-publish/main/package.json').version")
        PLATFORMS=(darwin-x64 darwin-arm64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64)
        for platform in "${PLATFORMS[@]}"; do
          name="${MAIN_NAME}-${platform}"
          if [ ! -d "npm-publish/${platform}" ]; then
            echo "Skipping ${name} (package directory not generated)"
            continue
          fi
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${name}@${VERSION} (already published)"
            continue
          fi
          echo "Publishing ${name}@${VERSION}"
          (cd "npm-publish/${platform}" && npm publish --access public --provenance)
        done

    - name: Wait for platform packages on NPM
      if: ${{ vars.NPM_PUBLISH == 'true' }}
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        set -euo pipefail
        MAIN_NAME=$(node -p "require('./npm/main/package.json').name")
        VERSION=$(node -p "require('./npm-publish/main/package.json').version")
        PLATFORMS=(darwin-x64 darwin-arm64 linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl win32-x64)
        deadline=$((SECONDS + 300))
        while true; do
          missing=0
          for platform in "${PLATFORMS[@]}"; do
            if [ ! -d "npm-publish/${platform}" ]; then
              continue
            fi
            name="${MAIN_NAME}-${platform}"
            if ! npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "Waiting for ${name}@${VERSION}..."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "All platform packages are visible on npm"
            break
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "Timed out waiting for platform packages to appear on npm"
            exit 1
          fi
          sleep 10
        done

    - name: Publish main package to NPM
      if: ${{ vars.NPM_PUBLISH == 'true' }}
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        set -euo pipefail
        MAIN_NAME=$(node -p "require('./npm/main/package.json').name")
        VERSION=$(node -p "require('./npm-publish/main/package.json').version")
        if npm view "${MAIN_NAME}@${VERSION}" version >/dev/null 2>&1; then
          echo "Skipping ${MAIN_NAME}@${VERSION} (already published)"
        else
          echo "Publishing ${MAIN_NAME}@${VERSION}"
          (cd npm-publish/main && npm publish --access public --provenance)
        fi
